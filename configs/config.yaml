# Network Anomaly Detection — configuration

data:
  dataset: "nsl_kdd"          # nsl_kdd | cicids2017
  # NSL-KDD: download from https://www.unb.ca/cic/datasets/nsl.html
  # Place KDDTrain+.txt and KDDTest+.txt into data/
  train_path: "data/KDDTrain+.txt"
  test_path: "data/KDDTest+.txt"
  random_state: 42
  test_size: 0.2             # used only if single file is provided

preprocessing:
  numeric_scaler: "standard"  # standard | minmax
  categorical_encoding: "onehot"
  handle_imbalance: "smote"   # smote | class_weight | none
  smote_k_neighbors: 5

models:
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_leaf: 2
    n_jobs: -1
    class_weight: "balanced"
  xgboost:
    n_estimators: 300
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "logloss"
    use_label_encoder: false
  autoencoder:
    encoding_dim: 32
    hidden_dims: [64, 32]
    epochs: 30
    batch_size: 256
    learning_rate: 0.001
    threshold_percentile: 95   # reconstruction error threshold on normal traffic

training:
  random_state: 42
  models_dir: "results/models"
  metrics_path: "results/metrics.json"
  figures_dir: "results/figures"

evaluation:
  positive_label: 1           # 1 = attack / anomaly
